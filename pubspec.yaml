name: barakah
description: Barakah mobile app
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  crypto: ^3.0.7
  drift: ^2.35.2
  flutter:
    sdk: flutter
  flutter_compass: ^0.8.1
  flutter_local_notifications: ^22.3.2
  flutter_riverpod: ^3.4.3
  geocoding: ^5.0.0
  geolocator: ^14.0.1
  http: ^1.6.0
  permission_handler: ^13.0.2
  provider: ^6.1.5+1
  sensors_plus: ^7.1.1
  shared_preferences: ^2.5.6
  timezone: ^0.11.2
  

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  drift_dev: ^2.35.1
  build_runner: ^2.16.2

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/audio/
    - assets/data/
    - assets/fonts/
    - assets/images/
