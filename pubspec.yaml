name: barakah
description: Barakah mobile app
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

hooks:
  user_defines:
    sqlite3:
      source: sqlite3mc

dependencies:
  connectivity_plus: ^7.3.2
  crypto: ^3.0.7
  dio: ^5.11.1
  drift: ^2.35.2
  flutter:
    sdk: flutter
  flutter_dotenv: ^5.1.0
  flutter_local_notifications: ^22.3.2
  flutter_map: ^8.3.2
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  geocoding: ^5.0.0
  geolocator: ^14.0.1
  go_router: ^18.1.0
  latlong2: ^0.10.1
  local_auth: ^3.0.2
  path: ^1.9.1
  path_provider: ^2.1.6
  permission_handler: ^13.0.2
  provider: ^6.1.5+1
  sensors_plus: ^7.1.1
  shared_preferences: ^2.5.6
  timezone: ^0.11.2
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  drift_dev: ^2.35.1
  build_runner: ^2.16.2

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/audio/
    - assets/data/
    - assets/fonts/
    - assets/images/
    - .env
